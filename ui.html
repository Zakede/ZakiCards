<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ザキCards</title>
<link rel="icon" href="/assets/icon.png">
<style>
  :root {
    --accent: #F5A9C3;
    --accent-deep: color-mix(in srgb, var(--accent) 42%, #000);
    --accent-ghost: color-mix(in srgb, var(--accent) 11%, #000);
    --accent-glow: color-mix(in srgb, var(--accent) 55%, transparent);
    --dim: #737b7a;
    --line: #1c2020;
    --panel: #060808;
    --text: #d2d8d7;
    --card-text: #d6dcdb;
    --bright: .7;
    --ui: 1.1;
    --card-size: 1;
    --card-width: 82vw;
    --card-font: "Yu Gothic UI", "Meiryo", "Segoe UI", system-ui, sans-serif;
    --speed: 1;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", system-ui, sans-serif; font-size: 16px; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--accent-deep); }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }

  /* ---------------- stars (dim, always drifting: no static pixels) ---------------- */
  #stars { position: fixed; inset: 0; pointer-events: none; opacity: .5; transition: opacity 1s; }
  body.playing #stars { opacity: 0; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .rise { animation: rise .8s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }

  /* ---------------- logo (inline SVG, follows the accent colour) ---------------- */
  .logo { position: relative; width: 66px; height: 66px; flex: none; color: var(--accent); animation: float 5s ease-in-out infinite; }
  .logo svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 25%, transparent)); }
  .logo .glint { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.65) 47%, transparent 56%);
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-mask: var(--logo-mask) center / contain no-repeat; mask: var(--logo-mask) center / contain no-repeat;
    animation: glint 6s ease-in-out infinite 1.5s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
  @keyframes glint { 0%, 70% { background-position: 100% 0; } 85%, 100% { background-position: -50% 0; } }
  .logo:hover { animation-duration: 1.2s; }

  /* ---------------- menu ---------------- */
  #menu { position: relative; height: calc(100% / var(--ui)); zoom: var(--ui); display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 44px;
    padding: 36px 52px; max-width: 1340px; margin: 0 auto; transition: opacity .5s, transform .6s var(--ease-out), filter .5s; }
  #menu.leaving { opacity: 0; transform: scale(.97); filter: blur(8px); pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .brand > div:nth-child(2) { flex: 1; }
  h1 { font-weight: 700; letter-spacing: .01em; margin: 0; font-size: 34px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 2px 0 0; font-size: 15px; }
  .topctl { display: flex; gap: 8px; align-self: flex-start; align-items: center; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
  .lang button { border: 0; background: none; color: var(--dim); font-size: 13px; padding: 4px 11px; border-radius: 99px; cursor: pointer; transition: all .2s; }
  .lang button.on { background: var(--accent-ghost); color: var(--accent); }
  .gear { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; transition: all .3s; }
  .gear:hover { color: var(--accent); border-color: var(--accent-deep); transform: rotate(60deg); }
  .gear svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; }
  .head:first-child { margin-top: 0; }
  .head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 0; flex: 1; font-weight: 600; }
  .link { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 14px; padding: 5px 9px; border-radius: 7px; transition: color .2s, background .2s; }
  .link:hover { color: var(--accent); background: var(--accent-ghost); }
  .link.solid { border: 1px solid var(--line); }
  #reload.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lists { flex: 1; overflow-y: auto; scrollbar-color: #222 #000; padding-right: 6px; }
  .tree { border-top: 1px solid var(--line); padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 9px; padding: 9px 9px; border-radius: 9px; cursor: pointer; user-select: none; font-size: 16px;
    transition: background .2s, transform .2s var(--ease-out); animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 25ms); }
  .row:hover { background: #0a0d0d; transform: translateX(3px); }
  .row .tw { width: 22px; text-align: center; color: var(--dim); font-size: 14px; flex: none; transition: transform .25s var(--ease-out), color .2s; }
  .row .tw.open { transform: rotate(90deg); }
  .row .tw:hover { color: var(--accent); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ct { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .row .tag { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; text-transform: uppercase; letter-spacing: .06em; }
  .row .edit { opacity: 0; border: 0; background: none; color: var(--dim); cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: opacity .2s, color .2s; }
  .row:hover .edit { opacity: 1; }
  .row .edit:hover { color: var(--accent); }
  .row.inherited { opacity: .55; }
  .box { width: 18px; height: 18px; border: 1.5px solid #3a4241; border-radius: 5px; flex: none; display: grid; place-items: center;
    transition: background .2s, border-color .2s, transform .3s var(--spring); }
  .row.on .box, .row.inherited .box { border-color: var(--accent); background: var(--accent); }
  .row.on .box { transform: scale(1.08); }
  .row.on .box::after, .row.inherited .box::after { content: ""; width: 8px; height: 4px; border: 2px solid #000; border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(1px, -1px); animation: tick .3s var(--spring); }
  @keyframes tick { from { transform: rotate(-45deg) translate(1px, -1px) scale(0); } }
  .empty { color: var(--dim); font-size: 14px; padding: 10px 8px; line-height: 1.6; }
  .empty b { color: var(--text); font-weight: 600; }

  .side { border-left: 1px solid var(--line); padding-left: 40px; overflow-y: auto; overflow-x: hidden; scrollbar-color: #222 #000; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 7px; }
  .field > label small { color: #4a5150; }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .times div { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; transition: border-color .2s; }
  .times div:focus-within { border-color: var(--accent-deep); }
  .times small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .times input { width: 100%; background: none; border: 0; font-size: 24px; outline: none; padding: 0; }
  .times input::-webkit-inner-spin-button { opacity: .3; }
  .presets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 99px; padding: 4px 11px; font-size: 13px; cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--accent-deep); color: var(--accent); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; outline: none; }
  select option { background: #000; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-bottom: 11px; font-size: 15px; }
  .toggle input { accent-color: var(--accent); margin-top: 4px; width: 16px; height: 16px; }
  .toggle small { display: block; color: var(--dim); font-size: 13px; }
  #start { position: relative; overflow: hidden; width: 100%; padding: 15px; border-radius: 13px; border: 0; background: var(--accent); color: #000;
    font-weight: 700; font-size: 17px; cursor: pointer; margin-top: 6px; transition: transform .2s var(--spring), box-shadow .3s, background .3s; }
  #start:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 30px -8px var(--accent-glow); }
  #start:not(:disabled):active { transform: scale(.98); }
  #start::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
    transform: translateX(-100%); }
  #start:not(:disabled):hover::after { transform: translateX(100%); transition: transform .8s var(--ease-out); }
  #start:disabled { background: #141918; color: var(--dim); cursor: default; }
  #summary { color: var(--dim); font-size: 14px; text-align: center; margin-top: 8px; min-height: 20px; }
  #summary.good { color: var(--accent); }
  .keys { color: var(--dim); font-size: 13px; line-height: 1.9; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  kbd { border: 1px solid #2a302f; border-radius: 4px; padding: 0 5px; font-family: inherit; font-size: 12px; }
  .err { color: #e08a7a; }
  .ver { color: #2c3332; font-size: 12px; margin-top: 12px; }

  /* ---------------- sheets: deck editor + settings ---------------- */
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.72);
    opacity: 0; pointer-events: none; transition: opacity .3s; }
  .modal.open { opacity: 1; pointer-events: auto; }
  .sheet { zoom: var(--ui); width: min(780px, 92vw); max-height: calc(88vh / var(--ui)); display: flex; flex-direction: column; gap: 12px; padding: 24px;
    background: #050707; border: 1px solid #1d2323; border-radius: 18px; transform: translateY(20px) scale(.97); transition: transform .45s var(--spring); }
  .modal.open .sheet { transform: none; }
  .sheet h3 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .sheet h3 .x { margin-left: auto; }
  .sheet input[type=text], .sheet textarea { width: 100%; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .2s; }
  .sheet input[type=text]:focus, .sheet textarea:focus { border-color: var(--accent-deep); }
  .sheet textarea { min-height: 300px; resize: vertical; font-size: 16px; line-height: 1.6; scrollbar-color: #222 #000; }
  .sheet .hint { color: var(--dim); font-size: 13px; line-height: 1.6; }
  .sheet .hint code { color: var(--accent); }
  .sheet .btns { display: flex; gap: 8px; align-items: center; }
  .sheet .btns .grow { flex: 1; color: var(--dim); font-size: 14px; }
  .btn { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 16px; cursor: pointer; transition: all .2s; }
  .btn:hover { border-color: var(--accent-deep); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .btn.primary:hover { color: #000; box-shadow: 0 6px 24px -8px var(--accent-glow); }
  .btn.danger:hover { border-color: #6b3a33; color: #e08a7a; }

  #setSheet { width: min(860px, 94vw); }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .tabs button { border: 0; background: none; color: var(--dim); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all .2s; }
  .tabs button.on { background: var(--accent-ghost); color: var(--accent); }
  .panes { overflow-y: auto; scrollbar-color: #222 #000; padding-right: 6px; min-height: 340px; }
  .pane { display: none; }
  .pane.on { display: block; animation: rise .4s var(--ease-out) both; }
  .set { display: grid; grid-template-columns: 210px 1fr 64px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid #0f1212; }
  .set > div:first-child { font-size: 15px; }
  .set > div:first-child small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .set .val { color: var(--dim); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: none; color: var(--dim); padding: 7px 8px; cursor: pointer; font-size: 14px; transition: all .2s; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-ghost); color: var(--accent); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .2s var(--spring), border-color .2s; }
  .sw:hover { transform: scale(1.12); }
  .sw.on { border-color: #fff; }
  .swatches input[type=color] { width: 34px; height: 34px; border: 0; background: none; padding: 0; cursor: pointer; }
  .prevcard { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; height: 150px; display: grid; place-items: center; overflow: hidden; background: #000; }
  .prevcard div { font-family: var(--card-font); color: var(--card-text); opacity: var(--bright); text-align: var(--card-align, center); width: 86%; line-height: 1.4; }
  .prevcard b { color: var(--accent); }

  /* ---------------- player ---------------- */
  #player { position: fixed; inset: 0; background: #000; display: none; cursor: none; user-select: none; }
  #player.cursor { cursor: default; }
  #stage { position: absolute; left: 50%; top: 50%; width: var(--card-width); max-height: 86vh;
    transform: translate(-50%, -50%); text-align: var(--card-align, center); line-height: 1.45; opacity: var(--bright);
    font-family: var(--card-font); color: var(--card-text); transition: opacity .3s; }
  #content > * { animation: cardIn calc(.9s * var(--speed)) var(--ease-out) both; }
  #content > *:nth-child(2) { animation-delay: calc(.08s * var(--speed)); } #content > *:nth-child(3) { animation-delay: calc(.16s * var(--speed)); }
  #content > *:nth-child(4) { animation-delay: calc(.24s * var(--speed)); } #content > *:nth-child(5) { animation-delay: calc(.32s * var(--speed)); }
  #content > *:nth-child(n+6) { animation-delay: calc(.4s * var(--speed)); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
  #content.out > * { animation: cardOut calc(.7s * var(--speed)) ease-in both; }
  @keyframes cardOut { to { opacity: 0; transform: translateY(-8px) scale(.98); filter: blur(10px); } }
  #content b, #content strong, #content .cloze { color: var(--accent); font-weight: 600; }
  #content .cloze { border-bottom: 2px solid var(--accent-deep); }
  #content hr { border: 0; height: 1px; width: 40%; margin: .6em auto; background: linear-gradient(90deg, transparent, #2a2f2f, transparent); }
  #content img { max-width: 60vw; max-height: 45vh; border-radius: 8px; }
  #content rt { font-size: .45em; opacity: .7; }
  #content.answer { opacity: .9; }
  #bar { height: 2px; width: 120px; margin: 1.4em auto 0; background: #121616; overflow: hidden; border-radius: 2px; transition: opacity .4s; }
  #bar i { display: block; height: 100%; background: var(--accent-deep); width: 100%; transform-origin: left; }
  #content.out + #bar, body.nobar #bar { opacity: 0; }
  #hold { position: absolute; left: 50%; bottom: -3.2em; transform: translateX(-50%); font-size: 13px; letter-spacing: .25em; color: var(--accent-deep);
    font-family: "Yu Gothic UI", sans-serif; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #player.holding #hold { opacity: 1; }
  #player.holding #bar i { background: #2a3030; }
  #clock { position: fixed; color: #3a4241; font-size: 7vh; font-weight: 300; letter-spacing: .04em; font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  #clock small { display: block; font-size: .28em; letter-spacing: .2em; text-align: center; color: #2c3332; }
  #clock.show { opacity: var(--bright); }
  #toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 10px); color: #6b7472; font-size: 14px;
    opacity: 0; transition: opacity .35s, transform .35s var(--ease-out); pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #paused { position: fixed; color: #4c5453; font-size: 13px; letter-spacing: .3em; display: none; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ---------------- drop-down top bar ---------------- */
  #topzone { position: fixed; left: 0; right: 0; top: 0; height: 18px; z-index: 5; }
  #topbar { position: fixed; left: 50%; top: 14px; z-index: 6; display: flex; align-items: center; gap: 6px; zoom: var(--ui);
    padding: 8px 10px 8px 12px; border-radius: 16px; background: rgba(8, 11, 11, .94); border: 1px solid #1d2323;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.9); backdrop-filter: blur(12px);
    transform: translate(-50%, -140%); opacity: 0; transition: transform .55s var(--spring), opacity .3s; cursor: default; white-space: nowrap; }
  #topbar.open { transform: translate(-50%, 0); opacity: 1; }
  #topbar .logo { width: 30px; height: 30px; animation-duration: 3s; }
  #topbar .info { padding: 0 10px 0 4px; min-width: 150px; }
  #topbar .info b { display: block; font-size: 14px; font-weight: 600; color: #b9c1c0; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  #topbar .info small { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 26px; background: #1d2323; margin: 0 4px; }
  .ib { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: #8b9493; border-radius: 10px; cursor: pointer;
    transition: background .2s, color .2s, transform .2s var(--spring); }
  .ib:hover { background: var(--accent-ghost); color: var(--accent); transform: translateY(-1px); }
  .ib:active { transform: scale(.92); }
  .ib.on { color: var(--accent); }
  .ib svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .phase { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 6px; border-radius: 9px; transition: background .3s; }
  .phase.now { background: var(--accent-ghost); }
  .phase small { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .phase.now small { color: var(--accent); }
  .step { display: flex; align-items: center; gap: 2px; }
  .step button { width: 22px; height: 24px; border: 0; background: none; color: #59625f; cursor: pointer; border-radius: 6px; font-size: 15px; line-height: 1; }
  .step button:hover { color: var(--accent); background: var(--accent-ghost); }
  .step span { min-width: 28px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
  .bright { display: flex; align-items: center; gap: 6px; color: #59625f; padding: 0 4px; }
  .bright input { width: 80px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="menu">
  <div class="col">
    <div class="brand rise">
      <div class="logo" data-logo></div>
      <div><h1>ザキ<span>Cards</span></h1><p class="sub" data-i="tagline"></p></div>
      <div class="topctl">
        <div class="lang"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div>
        <button class="gear" id="openSettings" data-i-title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
      </div>
    </div>
    <div id="lists" class="rise" style="--i:1">
      <div class="head">
        <h2 data-i="myDecks"></h2>
        <button class="link solid" id="newDeck" data-i="newDeck"></button>
        <button class="link solid" id="import" data-i="import" data-i-title="importTitle"></button>
      </div>
      <div class="tree" id="localTree"></div>
      <div class="head">
        <h2>Anki</h2>
        <select id="profile" style="width:auto;padding:4px 8px;font-size:13px"></select>

/* ---------------- player ---------------- */
let ids = [], idx = 0, phase = null, timer = null, endsAt = 0, remaining = 0, paused = false, cache = new Map(), toastT, skipped = 0;
let seen = new Set(), sessionStart = 0, sleepT = null, wasFull = true, holding = false;
const playing = () => document.body.classList.contains('playing');

$('#start').onclick = async () => {
  readForm();
  if (S.q + S.a + S.black === 0) { $('#summary').textContent = T.zeroPhases; return; }
  $('#start').disabled = true; $('#summary').textContent = T.loadingShort;
  const r = await api('/api/start', S);
  $('#start').disabled = false;
  if (r.error || !r.ids.length) { $('#summary').textContent = r.error || T.noMatch; return; }
  ids = r.ids; idx = 0; cache.clear(); paused = false; seen = new Set(); sessionStart = Date.now();
  wasFull = FULL;
  if (S.play_full && !FULL) FULL = (await api('/api/fullscreen', { on: true })).full;
  clearTimeout(sleepT);
  if (S.sleep_min > 0) sleepT = setTimeout(() => { stop(); flash(T.sleepDone); api('/api/stop', S); }, S.sleep_min * 60000);
  $('#menu').classList.add('leaving');
  await wait(450);
  $('#menu').style.display = 'none'; document.body.classList.add('playing'); $('#player').style.display = 'block';
  updateBar(); showCard();
};

const wait = ms => new Promise(r => setTimeout(r, ms));
const getCard = id => { if (!cache.has(id)) cache.set(id, api('/api/card?id=' + encodeURIComponent(id))); return cache.get(id); };
const isBlank = h => !h || !h.replace(/<(?!img)[^>]+>/g, '').replace(/&nbsp;|\s/g, '');

async function showCard() {
  if (idx >= ids.length) {
    if (S.on_end === 'stop') { stop(); return; }
    idx = 0; if (S.order === 'shuffle') ids.sort(() => Math.random() - .5);
  }
  if (idx < 0) idx = ids.length - 1;
  const card = await getCard(ids[idx]);
  getCard(ids[(idx + 1) % ids.length]); // preload
  if (cache.size > 40) cache.delete(cache.keys().next().value);
  if (!card.error && isBlank(card.q) && skipped < ids.length) { skipped++; idx++; return showCard(); }  // empty card: skip
  skipped = 0;
  window._card = card; seen.add(ids[idx]);
  const amt = S.shift ? (S.shift_amount ?? 6) : 0;
  const dx = (Math.random() * 2 - 1) * amt * .8, dy = (Math.random() * 2 - 1) * amt;
  $('#stage').style.transform = `translate(calc(-50% + ${dx}vw), calc(-50% + ${dy}vh))`;
  go(S.q > 0 ? 'q' : S.a > 0 ? 'a' : 'black');
}

let goToken = 0;
async function go(p) {
  const token = ++goToken;
  phase = p; clearTimeout(timer);
  const secs = S[p];
  const content = $('#content');
  const sp = S.anim === 'none' ? 0 : S.anim === 'fast' ? .45 : 1;
  updateBar();
  if (p === 'black') {
    content.classList.add('out');
    schedule(secs * 1000);
    if (S.clock && secs >= 2) setTimeout(() => token === goToken && showClock(), 700 * sp);
    await wait(700 * sp); if (token === goToken) content.innerHTML = '';
    return;
  }
  hideClock();
  if (content.innerHTML && !content.classList.contains('out')) {   // cross-fade q -> a
    content.classList.add('out'); await wait(380 * sp); if (token !== goToken) return;
  }
  const c = window._card;
  if (!c) return;   // first card still loading
  content.innerHTML = c.error ? `<span class="err">${esc(c.error)}</span>` : wrapLines(p === 'q' ? c.q : c.a);
  content.className = p === 'a' ? 'answer' : '';
  fit();
  const bar = $('#bar i');
  bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `transform ${secs}s linear`; bar.style.transform = 'scaleX(0)';
  }));
  schedule(secs * 1000);
}

// group loose text into blocks so each line can animate in on its own
function wrapLines(h) {
  const t = document.createElement('div'); t.innerHTML = h;
  const out = document.createElement('div'); let cur = null;
  for (const n of [...t.childNodes]) {
    if (n.nodeType === 1 && n.tagName === 'BR') { cur = null; continue; }
    if (n.nodeType === 1 && /^(DIV|P|HR|UL|OL|TABLE|H\d|IMG|BLOCKQUOTE)$/.test(n.tagName)) { out.appendChild(n); cur = null; }
    else { if (n.nodeType === 3 && !n.textContent.trim() && !cur) continue; if (!cur) { cur = document.createElement('div'); out.appendChild(cur); } cur.appendChild(n); }
  }
  return out.innerHTML;
}

let clockT;
function showClock() {
  const c = $('#clock'), now = new Date();
  let h = now.getHours(), suf = '';
  if (S.clock24 === false) { suf = h < 12 ? ' am' : ' pm'; h = h % 12 || 12; }
  c.innerHTML = `${h}:${String(now.getMinutes()).padStart(2, '0')}<span style="font-size:.4em">${suf}</span><small>${T.days[now.getDay()]} ${now.getMonth() + 1}/${now.getDate()}</small>`;
  c.style.left = (8 + Math.random() * 70) + 'vw'; c.style.top = (10 + Math.random() * 70) + 'vh';
  c.classList.add('show');
  clearTimeout(clockT); clockT = setTimeout(hideClock, Math.max(1000, remaining - 1400));
}
function hideClock() { $('#clock').classList.remove('show'); }

function schedule(ms) {
  remaining = ms; endsAt = Date.now() + ms;
  if (!paused && !holding) timer = setTimeout(next, ms);
}

function next() {
  if (phase === 'q' && S.a > 0) return go('a');
  if ((phase === 'q' || phase === 'a') && S.black > 0) return go('black');
  idx++; showCard();
}

// shrink text until the card fits on screen
function fit() {
  const c = $('#content');
  const k = (S.card_size || 100) / 100;
  let size = Math.min(innerHeight * 0.085, innerWidth * 0.052) * k;
  c.style.fontSize = size + 'px';
  const max = innerHeight * 0.8;
  while (c.scrollHeight > max && size > 14) { size *= 0.92; c.style.fontSize = size + 'px'; }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700);
}

// freeze / unfreeze the countdown (shared by pause and hold)
function freeze() {
  clearTimeout(timer); remaining = Math.max(0, endsAt - Date.now());
  const bar = $('#bar i'), cs = getComputedStyle(bar).transform; bar.style.transition = 'none'; bar.style.transform = cs;
}
function unfreeze() {
  endsAt = Date.now() + remaining; timer = setTimeout(next, remaining);
  const bar = $('#bar i'); bar.style.transition = `transform ${remaining / 1000}s linear`; bar.style.transform = 'scaleX(0)';
}

function togglePause() {
  paused = !paused;
  const p = $('#paused');
  if (paused) {
    if (!holding) freeze();
    p.style.left = (10 + Math.random() * 75) + 'vw'; p.style.top = (12 + Math.random() * 76) + 'vh'; p.style.display = 'block';
  } else {
    p.style.display = 'none'; if (!holding) unfreeze();
  }
  $('#pauseIcon').innerHTML = paused ? '<path d="M7 4v16l13-8L7 4Z"/>' : '<path d="M8 5v14M16 5v14"/>';
}

async function stop() {
  if (!playing()) return;
  clearTimeout(timer); clearTimeout(sleepT); goToken++; paused = false; holding = false; $('#paused').style.display = 'none'; hideClock();
  $('#player').classList.remove('holding');
  $('#content').innerHTML = ''; closeBar(true);
  $('#player').style.display = 'none'; document.body.classList.remove('playing');
  $('#menu').style.display = ''; fillForm();
  requestAnimationFrame(() => $('#menu').classList.remove('leaving'));
  if (S.play_full && !wasFull && FULL) FULL = (await api('/api/fullscreen', { on: false })).full;
  api('/api/stop', S); render();
  const mins = Math.max(1, Math.round((Date.now() - sessionStart) / 60000));
  if (seen.size) flash(T.session(seen.size, mins));
}

async function starCard() {
  if (!ids.length) return;
  const r = await api('/api/star', { id: ids[idx % ids.length] });
  if (r.local) LOCAL = r.local;
  toast(r.added ? T.starred(r.count) : T.already);
  const b = $('#starBtn'); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 1200);
}

function cardSize(delta) {
  S.card_size = Math.max(50, Math.min(200, (S.card_size || 100) + delta)); fit(); toast(T.sizeTo(S.card_size)); saveSoon();
}

const act = {
  prev() { if (paused) togglePause(); if (phase === 'q') idx--; showCard(); },
  next() { if (paused) togglePause(); next(); },
  pause: togglePause,
  answer() { if (paused) togglePause(); if (S.a > 0) go('a'); },
  black() { if (paused) togglePause(); go('black'); },
  async full() { FULL = (await api('/api/fullscreen', {})).full; },
  menu: stop,
  quit() { api('/api/quit'); },
  star: starCard,
};

/* ---------------- mouse on the card: hold = keep reading, click = skip, wheel = browse ---------------- */
let downAt = 0, holdT = null, wheelT = 0;
$('#player').addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('#topbar')) return;
  downAt = Date.now();
  holdT = setTimeout(() => {           // held for 250ms: freeze until released
    holding = true; $('#player').classList.add('holding');
    if (!paused) freeze();
  }, 250);
});
addEventListener('mouseup', e => {
  if (!playing() || e.button !== 0) return;
  clearTimeout(holdT);
  if (holding) {
    holding = false; $('#player').classList.remove('holding');
    if (!paused) unfreeze();
  } else if (downAt && Date.now() - downAt < 250 && !e.target.closest('#topbar')) {
    clickT = setTimeout(() => act.next(), 230);   // wait to see if it's a double-click
  }
  downAt = 0;
});
let clickT;
$('#player').addEventListener('dblclick', e => { if (e.target.closest('#topbar')) return; clearTimeout(clickT); act.full(); });
$('#player').addEventListener('wheel', e => {
  if (e.target.closest('#topbar') || Date.now() - wheelT < 450) return;
  wheelT = Date.now();
  if (e.deltaY > 0) { if (paused) togglePause(); idx++; showCard(); } else act.prev();
}, { passive: true });

/* ---------------- top bar ---------------- */
let barT, cursorT;
function updateBar() {
  $('#tbDeck').textContent = window._card?.deck?.split('::').pop() || '—';
  $('#tbCount').textContent = ids.length ? T.cardOf((idx % ids.length) + 1, ids.length.toLocaleString()) : '';
  $('#tq').textContent = S.q + 's'; $('#ta').textContent = S.a + 's'; $('#tb').textContent = S.black + 's';
  $('#phQ').classList.toggle('now', phase === 'q'); $('#phA').classList.toggle('now', phase === 'a'); $('#phB').classList.toggle('now', phase === 'black');
}
function openBar() { clearTimeout(barT); $('#topbar').classList.add('open'); $('#player').classList.add('cursor'); }
function closeBar(now) {
  clearTimeout(barT);
  barT = setTimeout(() => { $('#topbar').classList.remove('open'); $('#player').classList.remove('cursor'); }, now ? 0 : 900);
}
$('#topzone').addEventListener('mouseenter', openBar);
$('#topbar').addEventListener('mouseenter', openBar);
$('#topbar').addEventListener('mouseleave', () => closeBar());
$('#topbar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (b) return act[b.dataset.act]();
  const z = e.target.closest('[data-size]'); if (z) return cardSize(+z.dataset.size);
  const s = e.target.closest('[data-t]');
  if (s) { const k = s.dataset.t; S[k] = Math.max(0, Math.min(600, S[k] + +s.dataset.d)); if (S.q + S.a + S.black === 0) S[k] = 1; updateBar(); saveSoon(); }
});
document.addEventListener('mousemove', e => {
  if (!playing()) return;
  if (e.clientY < 18) openBar();
  $('#player').classList.add('cursor'); clearTimeout(cursorT);
  cursorT = setTimeout(() => { if (!$('#topbar').classList.contains('open')) $('#player').classList.remove('cursor'); }, 1500);
});
addEventListener('resize', () => { if (playing()) fit(); });

/* ---------------- keys ---------------- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ($('#modal').classList.contains('open')) {
    if (k === 'escape') closeEditor();
    if (k === 's' && e.ctrlKey) { e.preventDefault(); $('#mSave').click(); }
    return;
  }
  if ($('#settings').classList.contains('open')) { if (k === 'escape') $('#settings').classList.remove('open'); return; }
  if (!playing()) {
    if (e.target.matches('input,select,textarea')) return;
    if (k === 'q') api('/api/quit');
    if (k === 'f') act.full();
    if (k === 'enter' && !$('#start').disabled) $('#start').click();
    return;
  }
  if (e.target.matches('input[type=range]') && k.startsWith('arrow')) return;
  e.preventDefault();
  if (k === 'escape') stop();
  else if (k === 'q') act.quit();
  else if (k === 'f') act.full();
  else if (k === ' ' || k === 'arrowright') act.next();
  else if (k === 'arrowleft') act.prev();
  else if (k === 'enter') act.answer();
  else if (k === 'b') act.black();
  else if (k === 'p') togglePause();
  else if (k === 's') starCard();
  else if (k === '+' || k === '=') cardSize(10);
  else if (k === '-' || k === '_') cardSize(-10);
  else if (k === 'arrowup') { setBright(S.brightness + 10); toast(T.brightTo(S.brightness)); saveSoon(); }
  else if (k === 'arrowdown') { setBright(S.brightness - 10); toast(T.brightTo(S.brightness)); saveSoon(); }
});

applyLang((navigator.language || '').startsWith('ja') ? 'ja' : 'en');
init();
</script>
</body>
</html>
